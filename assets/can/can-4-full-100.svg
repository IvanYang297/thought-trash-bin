<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 280" width="240" height="280"><style>
.shake{animation:shake .18s linear infinite;transform-origin:120px 260px}
@keyframes shake{0%,100%{transform:translate(0,0) rotate(0)}25%{transform:translate(-3px,1px) rotate(-2deg)}75%{transform:translate(3px,-1px) rotate(2deg)}}
.lid-fight{animation:lid 0.9s ease-in-out infinite;transform-origin:40px 92px}
@keyframes lid{0%{transform:rotate(-24deg) translateY(-8px)}40%{transform:rotate(-3deg) translateY(0)}55%{transform:rotate(-1deg) translateY(1px)}70%{transform:rotate(-30deg) translateY(-12px)}100%{transform:rotate(-24deg) translateY(-8px)}}
.spray .paper{animation:spray 1.2s cubic-bezier(.2,.7,.4,1) infinite;animation-delay:calc(var(--i) * -0.15s);opacity:0}
@keyframes spray{0%{translate:0 0;opacity:0;scale:.6}10%{opacity:1}100%{translate:var(--dx) var(--dy);opacity:0;scale:1.1;rotate:var(--r)}}
@media (prefers-reduced-motion:reduce){.shake,.lid-fight,.spray .paper{animation:none}.spray .paper{opacity:1}}</style>
